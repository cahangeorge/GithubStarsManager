name: Official Stars update

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after synchronization and image verification
        type: boolean
        default: true

permissions: {}
concurrency:
  group: official-stars-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cahangeorge/github-stars-manager-fullstack

jobs:
  sync:
    if: github.repository == 'cahangeorge/GithubStarsManager' && github.ref == 'refs/heads/automation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation
      - name: Keep hourly scheduling active
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then
            git -c user.name='Stars updater' -c user.email='stars-updater@users.noreply.github.com' commit --allow-empty -m 'Keep official update schedule active'
            git push origin HEAD:automation
          fi
      - name: Synchronize exact official source
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/cahangeorge/GithubStarsManager/merge-upstream -f branch=main >/dev/null
          sha=$(gh api repos/cahangeorge/GithubStarsManager/git/ref/heads/main --jq .object.sha)
          official=$(gh api repos/AmintaCCCP/GithubStarsManager/git/ref/heads/main --jq .object.sha)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] && [ "$sha" = "$official" ]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Fork main matches official commit $sha"

  build:
    needs: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check previously built official commit
        id: existing
        env:
          SOURCE_SHA: ${{ needs.sync.outputs.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:official-$SOURCE_SHA" >/dev/null 2>&1; then
            digest=$(docker buildx imagetools inspect "$IMAGE:official-$SOURCE_SHA" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build official fullstack image
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.fullstack
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:official-${{ needs.sync.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/cahangeorge/GithubStarsManager
            org.opencontainers.image.revision=${{ needs.sync.outputs.sha }}
          cache-from: type=gha,scope=official-fullstack
          cache-to: type=gha,scope=official-fullstack,mode=max,ignore-error=true
      - name: Verify published image and native API health
        id: digest
        env:
          SOURCE_SHA: ${{ needs.sync.outputs.sha }}
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          docker run -d --name official-smoke -p 127.0.0.1:3000:3000 -e API_SECRET=ci-smoke-only "$IMAGE@$DIGEST"
          trap 'docker rm -f official-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health | jq -e '.status == "ok"' >/dev/null; then
              echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          exit 1

  deploy:
    needs: [sync, build]
    if: github.event_name == 'schedule' || inputs.deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: stars-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Verify updater tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Update existing Coolify service
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DESIRED_IMAGE: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: python3 -B scripts/deploy.py
